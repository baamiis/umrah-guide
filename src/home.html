{{>head.html}}
<style>
/* Home page only */
.home-hero{max-width:1120px;margin:0 auto;padding:clamp(2rem,6vw,4.5rem) 1.25rem 1.5rem;text-align:center}
.home-hero h1{font-size:clamp(2rem,5.5vw,3.4rem);max-width:20ch;margin:0 auto}
.home-hero p{color:var(--muted);max-width:52ch;margin:1rem auto 0;font-size:1.15rem}
.choose{max-width:1120px;margin:0 auto;padding:1.5rem 1.25rem 2rem;display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;scroll-margin-top:1rem}
.choice{display:flex;flex-direction:column;background:var(--surface);border:1.5px solid var(--line);border-radius:28px;padding:clamp(1.25rem,3vw,2rem);
  text-decoration:none;color:var(--ink);transition:border-color .2s,transform .15s,box-shadow .2s}
.choice:hover{border-color:var(--mosque);box-shadow:0 10px 30px rgba(0,0,0,.08)}
.choice:active{transform:translateY(1px)}
.choice svg{width:100%;max-width:280px;height:200px;margin:0 auto .5rem;display:block}
.choice .ar{font-size:clamp(2.6rem,6vw,3.4rem);line-height:1.3;color:var(--mosque);margin:0 0 .6rem;text-align:center}
.choice h2{font-size:clamp(1.6rem,3.5vw,2.1rem);text-align:center;margin:.1rem 0 .35rem}
.choice .meta{color:var(--gold);font-weight:600;text-align:center;margin:0 0 .9rem;font-size:.95rem}
.choice p{color:var(--muted);margin:0 0 1.5rem;text-align:center}
.choice .btn{margin-top:auto;align-self:center}
.choice:hover .btn{filter:brightness(1.12)}
@media (max-width:760px){.choose{grid-template-columns:1fr}.choice svg{height:160px}}
</style>
</head>
<body>
<a class="skip" href="#choose">{{skipHome}}</a>

<div class="topbar">
  <a class="brand" href="{{@base}}" aria-label="{{brandLabel}}">
    <svg viewBox="0 0 32 32" aria-hidden="true"><polygon points="16,3 29,16 16,29 3,16" fill="#000" stroke="var(--gold)" stroke-width="1.5"/><polygon points="16,7 25,16 16,25 7,16" fill="none" stroke="var(--gold)" stroke-width="2"/></svg>
    <span>{{brand}}</span>
  </a>
  <nav class="topnav" aria-label="{{navAria}}">
    <a href="#support" class="support-link" aria-label="{{navSupport}}">&#9829;<span class="sl-text"> {{navSupport}}</span></a>
    {{@langMenu}}
  </nav>
</div>

<header class="home-hero">
  <h1>{{home.title}}</h1>
  <p>{{home.lede}}</p>
</header>

<main class="choose" id="choose" tabindex="-1" style="outline:none">
  <a class="choice" href="{{@base}}umrah/">
    <svg viewBox="0 0 400 300" role="img" aria-label="{{home.umrahSvg}}">
      <circle class="orbit" cx="200" cy="150" r="80"/>
      <circle class="orbit" cx="200" cy="150" r="115"/>
      <g class="crowd">
        <g class="ring" style="animation-duration:40s;transform-origin:200px 150px" id="homeRing1"></g>
        <g class="ring" style="animation-duration:60s;transform-origin:200px 150px" id="homeRing2"></g>
      </g>
      <path class="hijr" d="M190,110 A22,22 0 0 0 160,140"/>
      <polygon class="kaaba" points="200,100 250,150 200,200 150,150"/>
      <polygon class="kiswa-band" points="200,112 238,150 200,188 162,150"/>
      <circle class="maqam" cx="246" cy="104" r="5"/>
    </svg>
    <p class="ar" lang="ar">عُمْرَة</p>
    <h2>{{home.umrahH}}</h2>
    <p class="meta">{{home.umrahMeta}}</p>
    <p>{{home.umrahP}}</p>
    <span class="btn">{{home.umrahCta}}</span>
  </a>

  <a class="choice" href="{{@base}}hajj/">
    <svg viewBox="15 60 380 165" role="img" aria-label="{{home.hajjSvg}}">
      <path d="M40,170 C100,140 150,132 190,132 C235,132 255,156 290,158 C320,160 345,170 365,172" fill="none" stroke="var(--line)" stroke-width="12" stroke-linecap="round"/>
      <path id="homeRoute" d="M40,170 C100,140 150,132 190,132 C235,132 255,156 290,158 C320,160 345,170 365,172" fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/>
      <g fill="var(--cloth)" stroke="var(--muted)" stroke-width="1"><path d="M166,116 L171,108 L176,116Z"/><path d="M177,116 L182,108 L187,116Z"/><path d="M188,116 L193,108 L198,116Z"/><path d="M199,116 L204,108 L209,116Z"/><path d="M171,107 L176,99 L181,107Z"/><path d="M182,107 L187,99 L192,107Z"/><path d="M193,107 L198,99 L203,107Z"/></g>
      <path d="M345,168 Q365,128 385,168 Z" fill="var(--figure)"/>
      <polygon class="kaaba" points="40,158 52,170 40,182 28,170"/>
      <g id="homePilgrim"><circle r="11" fill="var(--mosque)" opacity=".2"/><circle r="6" fill="var(--mosque)"/></g>
    </svg>
    <p class="ar" lang="ar">حَجّ</p>
    <h2>{{home.hajjH}}</h2>
    <p class="meta">{{home.hajjMeta}}</p>
    <p>{{home.hajjP}}</p>
    <span class="btn">{{home.hajjCta}}</span>
  </a>
</main>

{{>support.html}}

{{>footer.html}}

<script>
/* Old links to Umrah steps on this address (e.g. /#tawaf, /fr/#sai) now open the Umrah guide */
(function(){
  var id = location.hash.slice(1);
  if (['prepare','miqat','tawaf','prayer','sai','hair','complete'].indexOf(id) >= 0) location.replace('{{@base}}umrah/#' + id);
})();
{{>core.js}}

/* Small animations on the two cards */
[[80,9],[115,13]].forEach(([r,n],i) => {
  const g = $('#homeRing'+(i+1));
  for (let k=0;k<n;k++){ const a = (k/n)*Math.PI*2 + i; el('circle',{cx:200+r*Math.cos(a),cy:150+r*Math.sin(a),r:3.2},g); }
});
const route = $('#homeRoute'), pilgrim = $('#homePilgrim'), routeLen = route.getTotalLength();
let ht = 0, hlast = performance.now();
function homeLoop(now){
  const dt = Math.min((now - hlast) / 1000, 0.1); hlast = now;
  if (!reduce) ht = (ht + dt / 14) % 1;
  const u = ht < .5 ? ht * 2 : 2 - ht * 2;   // there and back
  const p = route.getPointAtLength(routeLen * (u < .5 ? 2*u*u : 1 - Math.pow(-2*u + 2, 2) / 2));
  pilgrim.setAttribute('transform', `translate(${p.x} ${p.y})`);
  requestAnimationFrame(homeLoop);
}
requestAnimationFrame(homeLoop);
</script>
</body>
</html>
