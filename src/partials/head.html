<!DOCTYPE html>
<!-- Generated by build.mjs from src/{{@page}}.html and i18n/. Do not edit directly. -->
<html lang="{{@lang}}" dir="{{@dir}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{meta.title}}</title>
<meta name="description" content="{{meta.description}}">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F6F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1613" media="(prefers-color-scheme: dark)">
{{@seo}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{siteName}}">
<meta property="og:title" content="{{meta.title}}">
<meta property="og:description" content="{{meta.share}}">
<meta property="og:image" content="https://umrahhaj.com/{{@ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{meta.imageAlt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{meta.title}}">
<meta name="twitter:description" content="{{meta.share}}">
<meta name="twitter:image" content="https://umrahhaj.com/{{@ogImage}}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<script>document.documentElement.classList.add('js');var mo=true;try{mo=localStorage.getItem('motion')!=='off'}catch(e){}if(mo)document.documentElement.classList.add('motion-on')</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{{@fonts}}
<style>
{{>base.css}}
</style>
